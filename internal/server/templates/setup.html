{{define "setup.html"}}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{.Title}}</title><link rel="stylesheet" href="/static/app.css"></head><body class="auth"><main class="auth-panel"><h1>Set up Server Probe</h1>{{if .Error}}<p class="error">{{.Error}}</p>{{end}}<p>Add this TOTP secret to your authenticator.</p><pre><code>{{.TOTPSecret}}</code></pre><form method="post" action="/setup"><input type="hidden" name="token" value="{{.SetupToken}}"><label>Password<input name="password" type="password" required autocomplete="new-password"></label><label>Verification code<input name="totp" inputmode="numeric" required autocomplete="one-time-code"></label><button type="submit">Complete setup</button></form></main></body></html>{{end}}
